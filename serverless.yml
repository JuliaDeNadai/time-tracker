service: time-tracker-api

frameworkVersion: "~3.40.0"

provider:
  name: aws
  # Serverless v3 schema lists up to nodejs20.x; AWS Lambda also accepts nodejs22.x.
  runtime: nodejs20.x
  region: ${env:AWS_REGION}
  role: arn:aws:iam::556479867163:role/role-for-time-tracker
  stage: prod
  deploymentBucket:
    name: time-tracker-code-bucket
  memorySize: 256
  timeout: 10
  logRetentionInDays: 14
  environment:
    NODE_ENV: production
    MONGO_URL: ${env:MONGO_URL}
    LAMBDA_URL: ${env:LAMBDA_URL}
    LIMIT_PER_MINUTE: ${env:LIMIT_PER_MINUTE}

functions:
  api:
    handler: dist/handler.handler
    url: true
    # reservedConcurrency omitted: account concurrency quota is low (must keep >=10 unreserved).
    # Re-add after raising Lambda concurrency quota in Service Quotas if you want a cost ceiling.

plugins:
  - serverless-offline
