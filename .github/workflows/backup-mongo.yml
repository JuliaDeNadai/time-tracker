name: Backup Mongo
on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install MongoDB Database Tools
        run: |
          curl -fsSL -o mongodb-database-tools.deb \
            https://fastdl.mongodb.org/tools/db/mongodb-database-tools-ubuntu2204-x86_64-100.10.0.deb
          sudo apt-get update
          sudo apt-get install -y ./mongodb-database-tools.deb

      - name: Configure AWS credentials (backup user)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.BACKUP_AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.BACKUP_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Dump and upload to S3
        env:
          MONGO_URL: ${{ secrets.MONGO_URL }}
          BACKUP_BUCKET: time-tracker-mongo-backups-556479867163
        run: |
          set -euo pipefail
          STAMP=$(date -u +%Y%m%d-%H%M%S)
          ARCHIVE="backup-${STAMP}.gz"
          mongodump --uri="$MONGO_URL" --archive="$ARCHIVE" --gzip
          aws s3 cp "$ARCHIVE" "s3://${BACKUP_BUCKET}/${ARCHIVE}"
          rm -f "$ARCHIVE"
