name: CI
on: push
jobs:
  continuous-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Using Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Dependencies and execute tests
        run: |
          npm install --legacy-peer-deps
          npm run test
